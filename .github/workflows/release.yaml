name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-macos
            asset: zdu-aarch64-macos.tar.gz
            binary: zdu
            package: tar.gz
            file_kind: Mach-O

          - runner: macos-15-intel
            target: x86_64-macos
            asset: zdu-x86_64-macos.tar.gz
            binary: zdu
            package: tar.gz
            file_kind: Mach-O

          - runner: ubuntu-24.04
            target: x86_64-linux-gnu
            asset: zdu-x86_64-linux.tar.gz
            binary: zdu
            package: tar.gz
            file_kind: ELF

          - runner: ubuntu-24.04-arm
            target: aarch64-linux-gnu
            asset: zdu-aarch64-linux.tar.gz
            binary: zdu
            package: tar.gz
            file_kind: ELF

          - runner: ubuntu-24.04
            target: x86_64-windows
            asset: zdu-x86_64-windows.zip
            binary: zdu.exe
            package: zip
            file_kind: PE32

          - runner: ubuntu-24.04
            target: aarch64-windows
            asset: zdu-aarch64-windows.zip
            binary: zdu.exe
            package: zip
            file_kind: PE32

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cache Zig
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            ~/Library/Caches/zig
            .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon', 'build.zig', 'src/**/*.zig', 'lib/**/*.zig') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-${{ env.ZIG_VERSION }}-
            ${{ runner.os }}-${{ runner.arch }}-zig-

      - name: Run tests
        run: zig build test --summary all

      - name: Build release binary
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }} -Dcpu=baseline --summary all

      - name: Verify artifact platform
        shell: bash
        run: |
          set -euo pipefail

          bin="zig-out/bin/${{ matrix.binary }}"
          test -f "$bin"
          if [ "${{ matrix.binary }}" = "zdu" ]; then
            test -x "$bin"
          fi
          file "$bin"

          case "${{ matrix.file_kind }}" in
            Mach-O)
              file "$bin" | grep -q 'Mach-O'
              ;;
            ELF)
              file "$bin" | grep -q 'ELF'
              ;;
            PE32)
              file "$bin" | grep -Eq 'PE32|MS Windows'
              ;;
            *)
              echo "unknown file_kind: ${{ matrix.file_kind }}" >&2
              exit 1
              ;;
          esac

      - name: Package asset
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p package dist
          cp "zig-out/bin/${{ matrix.binary }}" "package/${{ matrix.binary }}"
          if [ "${{ matrix.binary }}" = "zdu" ]; then
            chmod 755 package/zdu
          fi

          case "${{ matrix.package }}" in
            tar.gz)
              # Avoid macOS AppleDouble metadata in tarballs.
              COPYFILE_DISABLE=1 tar -C package -czf "dist/${{ matrix.asset }}" "${{ matrix.binary }}"
              ;;
            zip)
              ASSET="${{ matrix.asset }}" BINARY="${{ matrix.binary }}" python3 - <<'PY'
          import os
          import zipfile

          asset = os.environ["ASSET"]
          binary = os.environ["BINARY"]
          with zipfile.ZipFile(os.path.join("dist", asset), "w", zipfile.ZIP_DEFLATED) as zf:
              zf.write(os.path.join("package", binary), arcname=binary)
          PY
              ;;
            *)
              echo "unknown package kind: ${{ matrix.package }}" >&2
              exit 1
              ;;
          esac

          cd dist
          shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          ls -lh

      - name: Upload packaged asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish or update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"

          ls -lh release-assets

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$tag" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --generate-notes
          fi